<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON EXFIL</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none}body{margin:0;background:#071014;color:#d9f7e8;font-family:system-ui;overflow:hidden;touch-action:none}#g{width:100vw;height:100vh;display:block;background:#101a1d}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-weight:800;text-shadow:0 2px 4px #000}.chip{background:#071014cc;border:1px solid #3b6;padding:7px 10px;border-radius:12px}.controls{pointer-events:auto;position:absolute;left:0;right:0;bottom:14px;height:150px}.pad{position:absolute;left:18px;bottom:4px;width:132px;height:132px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff22}.nub{position:absolute;width:52px;height:52px;left:40px;top:40px;border-radius:50%;background:#8fc8ae80}.btn{position:absolute;border:1px solid #79ffc5;background:#0d2822dd;color:#dffff1;border-radius:50%;font-weight:900;width:70px;height:70px}.fire{right:20px;bottom:18px;background:#823433dd;border-color:#ff8d80}.use{right:104px;bottom:64px}.bag{right:100px;bottom:0}.hint{position:absolute;bottom:166px;left:50%;transform:translateX(-50%);font-size:12px;background:#0009;padding:5px 9px;border-radius:9px;white-space:nowrap}#panel{pointer-events:auto;display:none;position:absolute;inset:9% 5% 20%;background:#091416f4;border:1px solid #598c78;border-radius:18px;padding:14px;overflow:auto;box-shadow:0 20px 70px #000}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.slot{aspect-ratio:1;background:#142326;border:1px solid #45605b;border-radius:6px;display:grid;place-items:center;font-size:11px;text-align:center}.loot{color:#ffe58b}.close{float:right;background:#243;color:#fff;border:1px solid #7c9;border-radius:8px;padding:7px 12px}</style></head><body oncontextmenu="return false"><canvas id="g"></canvas><div class="hud"><div class="top"><span class="chip" id="hp">HP 100</span><span class="chip" id="status">DISTRICT 09</span><span class="chip" id="ammo">30 / 90</span></div><div class="hint">左で移動・右で射撃　緑の脱出地点へ帰還</div><div id="panel"><button class="close" onclick="panel.style.display='none'">閉じる</button><h2>TACTICAL BAG</h2><p>戦利品をタップしてバッグへ収納</p><div class="grid" id="grid"></div></div><div class="controls"><div class="pad" id="pad"><div class="nub" id="nub"></div></div><button class="btn use" id="use">探索</button><button class="btn bag" id="bag">BAG</button><button class="btn fire" id="fire">射撃</button></div></div><script>
const c=document.querySelector('#g'),x=c.getContext('2d');let W,H,D=devicePixelRatio||1;function rs(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
let p={x:1400,y:1100,hp:100,a:30},joy={x:0,y:0},bul=[],en=[],crates=[],loot=['GOLD CPU','MEDKIT','KEYCARD','OPTIC','BATTERY','ARMOR','SSD','RATIONS'],bag=[];for(let i=0;i<28;i++)en.push({x:300+Math.random()*2400,y:200+Math.random()*1900,h:3});for(let i=0;i<22;i++)crates.push({x:150+Math.random()*2700,y:150+Math.random()*2100,open:false});
function nearCrate(){return crates.find(q=>Math.hypot(q.x-p.x,q.y-p.y)<75)}function draw(){x.fillStyle='#0b1517';x.fillRect(0,0,W,H);let ox=W/2-p.x,oy=H/2-p.y;x.save();x.translate(ox,oy);x.fillStyle='#132326';x.fillRect(50,50,2900,2250);x.strokeStyle='#1e4140';x.lineWidth=4;for(let i=100;i<2900;i+=160){x.beginPath();x.moveTo(i,50);x.lineTo(i,2300);x.stroke()}for(let i=100;i<2300;i+=160){x.beginPath();x.moveTo(50,i);x.lineTo(2950,i);x.stroke()}x.fillStyle='#263438';for(let i=0;i<14;i++)x.fillRect(180+(i%4)*650,150+Math.floor(i/4)*560,330,210);x.fillStyle='#39ff99aa';x.fillRect(2670,1950,180,180);x.fillStyle='#6d5634';for(const q of crates){x.fillRect(q.x-15,q.y-12,30,24)}for(const e of en){x.fillStyle=e.h?'#ff5d69':'#3b3b3b';x.fillRect(e.x-10,e.y-10,20,20)}x.fillStyle='#8affc9';x.beginPath();x.arc(p.x,p.y,13,0,7);x.fill();x.fillStyle='#ffd6df';x.fillRect(p.x-8,p.y-10,16,9);x.fillStyle='#ff8fc2';x.fillRect(p.x-10,p.y-15,20,6);x.strokeStyle='#d7e7df';x.beginPath();x.moveTo(p.x+8,p.y);x.lineTo(p.x+25,p.y);x.stroke();x.fillStyle='#ffe06a';for(const b of bul)x.fillRect(b.x-2,b.y-2,5,5);x.restore();x.fillStyle='#ffffff08';for(let i=0;i<80;i++)x.fillRect((i*97)%W,(i*53)%H,1,1);update();requestAnimationFrame(draw)}
function update(){p.x=Math.max(65,Math.min(2935,p.x+joy.x*4));p.y=Math.max(65,Math.min(2285,p.y+joy.y*4));for(const b of bul){b.x+=b.vx*9;b.y+=b.vy*9;for(const e of en)if(e.h&&Math.hypot(b.x-e.x,b.y-e.y)<18){e.h--;b.x=-999}}bul=bul.filter(b=>b.x>0&&b.x<3000&&b.y>0&&b.y<2350);document.querySelector('#status').textContent=(p.x>2650&&p.y>1930)?'EXFIL READY':'DISTRICT 09'}
function shoot(){if(!p.a)return; p.a--; let t=en.filter(e=>e.h).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0],ang=t?Math.atan2(t.y-p.y,t.x-p.x):0;bul.push({x:p.x,y:p.y,vx:Math.cos(ang),vy:Math.sin(ang)});ammo.textContent=p.a+' / 90';beep(120,0.04)}
let ac;function beep(f,d){ac??=new AudioContext();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='square';g.gain.value=.025;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}
function inventory(items=[]){panel.style.display='block';grid.innerHTML='';[...bag,...items,...Array(Math.max(0,25-bag.length-items.length)).fill('')].slice(0,25).forEach((v,i)=>{let s=document.createElement('div');s.className='slot '+(items.includes(v)?'loot':'');s.textContent=v;s.onclick=()=>{if(v&&items.includes(v)&&bag.length<20){bag.push(v);inventory(items.filter(z=>z!==v));beep(500,.05)}};grid.append(s)})}
function padMove(e){let r=pad.getBoundingClientRect(),t=e.touches?e.touches[0]:e,dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),m=Math.min(45,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy={x:Math.cos(a)*m/45,y:Math.sin(a)*m/45};nub.style.transform=`translate(${joy.x*35}px,${joy.y*35}px)`}pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);padMove(e)};pad.onpointermove=e=>{if(e.buttons)padMove(e)};pad.onpointerup=()=>{joy={x:0,y:0};nub.style.transform=''};fire.onpointerdown=shoot;bag.onclick=()=>inventory();use.onclick=()=>{let q=nearCrate();if(q&&!q.open){q.open=true;inventory([loot[Math.random()*loot.length|0],loot[Math.random()*loot.length|0]]);beep(260,.08)}else if(p.x>2650&&p.y>1930){status.textContent='RAID SURVIVED';beep(800,.2)}};document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());draw();</script></body></html>
